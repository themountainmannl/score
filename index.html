<!DOCTYPE html>
<!-- Live Volleybal Scorer - Versie 1.4 -->
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Live Volleybal Scorer v1.4</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #121212; color: #fff; margin: 0; padding: 15px; display: flex; flex-direction: column; align-items: center; user-select: none; }
    .container { width: 100%; max-width: 600px; }
    .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; padding: 0 4px; }
    .version-tag { font-size: 11px; color: #666; font-family: monospace; }
    
    .timer-box { text-align: center; background: #1e1e1e; border: 1px solid #333; padding: 15px; border-radius: 12px; margin-bottom: 20px; }
    .timer { font-size: 44px; font-weight: bold; font-family: monospace; color: #34c759; margin: 8px 0; }
    
    .scoreboard { display: flex; gap: 12px; justify-content: space-between; margin-bottom: 25px; }
    .team-card { flex: 1; background: #1e1e1e; border: 1px solid #333; border-radius: 14px; padding: 15px; text-align: center; display: flex; flex-direction: column; gap: 8px; }
    .team-card input { width: 100%; background: transparent; border: none; border-bottom: 2px solid #555; color: #fff; font-size: 18px; font-weight: bold; text-align: center; padding: 4px; }
    .sets { font-size: 16px; font-weight: bold; color: #34c759; margin-top: 2px; }
    .score { font-size: 68px; font-weight: bold; margin: 2px 0; font-variant-numeric: tabular-nums; line-height: 1; }
    
    .btn-score-plus { width: 100%; height: 85px; font-size: 32px; font-weight: bold; border-radius: 12px; border: none; background: #007aff; color: white; cursor: pointer; }
    .btn-score-plus:active { background: #0056b3; }
    
    .btn-score-minus { width: 100%; height: 40px; font-size: 18px; font-weight: bold; border-radius: 8px; border: 1px solid #444; background: #2a2a2a; color: #bbb; cursor: pointer; }
    .btn-score-minus:active { background: #3a3a3a; color: #fff; }

    /* Handmatige Setknoppen */
    .set-controls { display: flex; gap: 6px; margin-top: 4px; }
    .btn-set { flex: 1; height: 34px; font-size: 12px; font-weight: bold; border-radius: 6px; border: 1px solid #3d3d3d; background: #1a1a1a; color: #aaa; cursor: pointer; }
    .btn-set:active { background: #333; color: #fff; }

    .center-controls { text-align: center; margin: 20px 0 15px 0; display: flex; justify-content: center; gap: 15px; padding-top: 15px; border-top: 1px solid #2a2a2a; }
    .btn { padding: 12px 20px; font-size: 15px; border-radius: 8px; border: none; cursor: pointer; font-weight: bold; }
    .btn-green { background: #34c759; color: white; }
    .btn-red { background: #ff3b30; color: white; }
    .btn-gray { background: #444; color: white; }
    
    .log-box { background: #0a0a0a; border: 1px solid #333; border-radius: 8px; padding: 10px; max-height: 120px; overflow-y: auto; font-family: monospace; font-size: 13px; color: #00ff66; margin-top: 10px; }
  </style>
</head>
<body>

<div class="container">
  <div class="header-bar">
    <span style="font-size: 12px; color: #888;" id="setIndicator">Set 1</span>
    <span class="version-tag">v1.4</span>
  </div>

  <div class="timer-box">
    <div style="font-size: 14px; color: #aaa;">Wedstrijdtijd (DJI Sync)</div>
    <div class="timer" id="timerDisplay">00:00:00</div>
    <div>
      <button class="btn btn-green" id="startBtn" onclick="toggleTimer()">▶ Start Timer (bij start DJI)</button>
      <button class="btn btn-gray" onclick="downloadSRT()">⬇ Download SRT</button>
    </div>
  </div>

  <div class="scoreboard">
    <!-- Team A -->
    <div class="team-card">
      <input type="text" id="teamAName" value="Team A">
      <div class="sets" id="teamASets">Sets: 0</div>
      <div class="score" id="scoreA">0</div>
      <button class="btn-score-plus" onclick="addPoint('A')">+1</button>
      <button class="btn-score-minus" onclick="subtractPoint('A')">-1</button>
      <div class="set-controls">
        <button class="btn-set" onclick="adjustSet('A', 1)">Set +</button>
        <button class="btn-set" onclick="adjustSet('A', -1)">Set -</button>
      </div>
    </div>

    <!-- Team B -->
    <div class="team-card">
      <input type="text" id="teamBName" value="Team B">
      <div class="sets" id="teamBSets">Sets: 0</div>
      <div class="score" id="scoreB">0</div>
      <button class="btn-score-plus" onclick="addPoint('B')">+1</button>
      <button class="btn-score-minus" onclick="subtractPoint('B')">-1</button>
      <div class="set-controls">
        <button class="btn-set" onclick="adjustSet('B', 1)">Set +</button>
        <button class="btn-set" onclick="adjustSet('B', -1)">Set -</button>
      </div>
    </div>
  </div>

  <div class="center-controls">
    <button class="btn btn-red" onclick="endSetManual()">Einde Set</button>
    <button class="btn btn-gray" onclick="undo()">Herstel Laatste Actie</button>
  </div>

  <div class="log-box" id="logBox">Druk op "Start Timer" zodra de camera begint met opnemen...</div>
</div>

<script>
  var APP_VERSION = "1.4";

  var startTime = null;
  var timerInterval = null;
  var isRunning = false;
  var elapsedBeforePause = 0;

  var scoreA = 0, scoreB = 0;
  var setsA = 0, setsB = 0;
  var currentSet = 1;
  var log = [];

  function getElapsedTime() {
    if (!startTime) return elapsedBeforePause;
    return elapsedBeforePause + ((Date.now() - startTime) / 1000);
  }

  function toggleTimer() {
    var btn = document.getElementById('startBtn');
    
    if (!isRunning) {
      startTime = Date.now();
      timerInterval = setInterval(updateTimerDisplay, 250);
      isRunning = true;
      if (btn) {
        btn.innerText = "⏸ Pauzeer Timer";
        btn.className = "btn btn-red";
      }

      if (log.length === 0) {
        log.push({ 
          time: 0, 
          text: getScoreString(), 
          state: { scoreA: scoreA, scoreB: scoreB, setsA: setsA, setsB: setsB, currentSet: currentSet } 
        });
        renderLog();
      }
    } else {
      elapsedBeforePause += (Date.now() - startTime) / 1000;
      startTime = null;
      clearInterval(timerInterval);
      isRunning = false;
      if (btn) {
        btn.innerText = "▶ Hervat Timer";
        btn.className = "btn btn-green";
      }
    }
  }

  function updateTimerDisplay() {
    var totalSec = Math.floor(getElapsedTime());
    var h = String(Math.floor(totalSec / 3600)).padStart(2, '0');
    var m = String(Math.floor((totalSec % 3600) / 60)).padStart(2, '0');
    var s = String(totalSec % 60).padStart(2, '0');
    var el = document.getElementById('timerDisplay');
    if (el) el.innerText = h + ":" + m + ":" + s;
  }

  function getScoreString() {
    var inA = document.getElementById('teamAName');
    var inB = document.getElementById('teamBName');
    var tA = (inA && inA.value) ? inA.value : "Team A";
    var tB = (inB && inB.value) ? inB.value : "Team B";
    return "Set " + currentSet + " (" + setsA + "-" + setsB + ") | " + tA + " " + scoreA + " - " + scoreB + " " + tB;
  }

  function renderLog() {
    var logBox = document.getElementById('logBox');
    if (!logBox) return;
    if (log.length === 0) {
      logBox.innerHTML = "Nog geen punten geregistreerd...";
      return;
    }
    logBox.innerHTML = log.map(function(item, idx) {
      var min = Math.floor(item.time / 60);
      var sec = Math.floor(item.time % 60);
      var tStr = String(min).padStart(2,'0') + ":" + String(sec).padStart(2,'0');
      return "[" + tStr + "] #" + (idx + 1) + ": " + item.text;
    }).reverse().join("<br>");
  }

  function recordState() {
    if (!isRunning) return;
    log.push({
      time: getElapsedTime(),
      text: getScoreString(),
      state: { scoreA: scoreA, scoreB: scoreB, setsA: setsA, setsB: setsB, currentSet: currentSet }
    });
    renderLog();
  }

  function updateDisplay() {
    var elA = document.getElementById('scoreA');
    var elB = document.getElementById('scoreB');
    var elSetsA = document.getElementById('teamASets');
    var elSetsB = document.getElementById('teamBSets');
    var elInd = document.getElementById('setIndicator');
    if (elA) elA.innerText = scoreA;
    if (elB) elB.innerText = scoreB;
    if (elSetsA) elSetsA.innerText = "Sets: " + setsA;
    if (elSetsB) elSetsB.innerText = "Sets: " + setsB;
    if (elInd) elInd.innerText = "Set " + currentSet;
  }

  function checkSetWon() {
    var target = (currentSet >= 5) ? 15 : 25;
    var diff = Math.abs(scoreA - scoreB);

    if ((scoreA >= target || scoreB >= target) && diff >= 2) {
      if (scoreA > scoreB) {
        setsA++;
      } else {
        setsB++;
      }
      scoreA = 0;
      scoreB = 0;
      currentSet++;
    }
  }

  function addPoint(team) {
    if (!isRunning) {
      alert("Start eerst de timer!");
      return;
    }
    if (team === 'A') scoreA++;
    if (team === 'B') scoreB++;

    // Controleer automatisch op setwinst
    checkSetWon();

    updateDisplay();
    recordState();
  }

  function subtractPoint(team) {
    if (!isRunning) return;
    if (team === 'A' && scoreA > 0) scoreA--;
    if (team === 'B' && scoreB > 0) scoreB--;
    updateDisplay();
    recordState();
  }

  function adjustSet(team, delta) {
    if (!isRunning) return;
    if (team === 'A') {
      setsA = Math.max(0, setsA + delta);
    } else {
      setsB = Math.max(0, setsB + delta);
    }
    updateDisplay();
    recordState();
  }

  function endSetManual() {
    if (!isRunning) return;
    if (scoreA > scoreB) setsA++;
    else if (scoreB > scoreA) setsB++;
    scoreA = 0; scoreB = 0;
    currentSet++;
    updateDisplay();
    recordState();
  }

  function undo() {
    if (log.length > 1) {
      log.pop();
      var last = log[log.length - 1].state;
      scoreA = last.scoreA;
      scoreB = last.scoreB;
      setsA = last.setsA;
      setsB = last.setsB;
      currentSet = last.currentSet;
      updateDisplay();
      renderLog();
    }
  }

  function formatSRTTime(seconds) {
    var hours = String(Math.floor(seconds / 3600)).padStart(2, '0');
    var mins = String(Math.floor((seconds % 3600) / 60)).padStart(2, '0');
    var secs = String(Math.floor(seconds % 60)).padStart(2, '0');
    var ms = String(Math.floor((seconds % 1) * 1000)).padStart(3, '0');
    return hours + ":" + mins + ":" + secs + "," + ms;
  }

  function downloadSRT() {
    if (log.length === 0) return;
    var srt = "";
    var totalDuration = getElapsedTime() + 10;

    for (var i = 0; i < log.length; i++) {
      var startTimeVal = log[i].time;
      var endTimeVal = (i < log.length - 1) ? log[i + 1].time : totalDuration;
      
      if (endTimeVal > startTimeVal) {
        srt += (i + 1) + "\n";
        srt += formatSRTTime(startTimeVal) + " --> " + formatSRTTime(endTimeVal) + "\n";
        srt += log[i].text + "\n\n";
      }
    }

    var now = new Date();
    var maanden = [
      "januari", "februari", "maart", "april", "mei", "juni",
      "juli", "augustus", "september", "oktober", "november", "december"
    ];
    var dag = now.getDate();
    var maand = maanden[now.getMonth()];
    var jaar = now.getFullYear();
    var uren = String(now.getHours()).padStart(2, '0');
    var minuten = String(now.getMinutes()).padStart(2, '0');

    var fileName = "wedstrijd_score_" + dag + "_" + maand + "_" + jaar + "_" + uren + "-" + minuten + ".srt";

    var blob = new Blob([srt], { type: 'text/plain;charset=utf-8' });
    var link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = fileName;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  }
</script>
</body>
</html>
