<!DOCTYPE html>
<!-- Live Volleybal Scorer - Versie 3.5 (Automatische Speelhelftwissel bij Seteinde) -->
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Live Volleybal Scorer v3.5</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #121212; color: #fff; margin: 0; padding: 15px; display: flex; flex-direction: column; align-items: center; user-select: none; }
    .container { width: 100%; max-width: 600px; }
    .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; padding: 0 4px; }
    .version-tag { font-size: 11px; color: #666; font-family: monospace; }
    
    .match-top-bar { display: flex; gap: 8px; margin-bottom: 12px; width: 100%; }
    .btn-top { flex: 1; height: 42px; background: #262626; border: 1px solid #444; color: #aaa; border-radius: 10px; font-size: 14px; font-weight: bold; cursor: pointer; text-align: center; }
    .btn-top.active { background: #007aff; color: #fff; border-color: #007aff; }
    .btn-top:disabled { opacity: 0.4; cursor: not-allowed; border-color: #333; }

    .timer-box { text-align: center; background: #1e1e1e; border: 1px solid #333; padding: 15px; border-radius: 12px; margin-bottom: 15px; }
    .timer { font-size: 44px; font-weight: bold; font-family: monospace; color: #34c759; margin: 6px 0; }
    .timer-hint { font-size: 12px; color: #888; margin-bottom: 8px; }
    
    .swap-bar { text-align: center; margin-bottom: 15px; }
    .btn-swap { background: #333; border: 1px solid #555; color: #fff; padding: 8px 18px; border-radius: 20px; font-size: 14px; font-weight: bold; cursor: pointer; }
    .btn-swap:active { background: #444; border-color: #007aff; }

    .scoreboard { display: flex; gap: 12px; justify-content: space-between; margin-bottom: 15px; }
    .team-card { flex: 1; background: #1e1e1e; border: 1px solid #333; border-radius: 14px; padding: 15px; text-align: center; display: flex; flex-direction: column; gap: 8px; }
    .team-card input { width: 100%; background: transparent; border: none; border-bottom: 2px solid #555; color: #fff; font-size: 18px; font-weight: bold; text-align: center; padding: 4px; }
    
    .sets { font-size: 24px; font-weight: bold; color: #34c759; margin-top: 4px; line-height: 1; font-variant-numeric: tabular-nums; }
    .sets-left { text-align: right; padding-right: 8px; }
    .sets-right { text-align: left; padding-left: 8px; }

    .score { font-size: 68px; font-weight: bold; margin: 2px 0; font-variant-numeric: tabular-nums; line-height: 1; }
    
    .btn-score-plus { width: 100%; height: 85px; font-size: 32px; font-weight: bold; border-radius: 12px; border: none; color: white; cursor: pointer; }
    .btn-blue { background: #007aff; }
    .btn-blue:active { background: #0056b3; }
    .btn-red-score { background: #ff3b30; }
    .btn-red-score:active { background: #d32f2f; }
    
    .btn-score-minus { width: 100%; height: 40px; font-size: 18px; font-weight: bold; border-radius: 8px; border: 1px solid #444; background: #2a2a2a; color: #bbb; cursor: pointer; }
    .btn-score-minus:active { background: #3a3a3a; color: #fff; }

    .set-controls { display: flex; gap: 6px; margin-top: 4px; }
    .btn-set { flex: 1; height: 34px; font-size: 12px; font-weight: bold; border-radius: 6px; border: 1px solid #3d3d3d; background: #1a1a1a; color: #aaa; cursor: pointer; }
    .btn-set:active { background: #333; color: #fff; }

    .set-results-box { background: #181818; border: 1px dashed #3a3a3a; border-radius: 8px; padding: 10px 15px; margin-bottom: 15px; text-align: center; }
    .set-results-title { font-size: 11px; text-transform: uppercase; color: #777; letter-spacing: 1px; margin-bottom: 4px; }
    .set-results-list { font-size: 17px; font-family: monospace; color: #34c759; font-weight: bold; letter-spacing: 0.5px; white-space: pre-wrap; }

    .center-controls { text-align: center; margin: 15px 0; display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; padding-top: 15px; border-top: 1px solid #2a2a2a; }
    .btn { padding: 12px 18px; font-size: 15px; border-radius: 8px; border: none; cursor: pointer; font-weight: bold; }
    .btn-green { background: #34c759; color: white; }
    .btn-green:active { background: #28a745; }
    .btn-red { background: #ff3b30; color: white; }
    .btn-gray { background: #333; color: white; border: 1px solid #444; }
    .btn-reset { background: #222; color: #ff453a; border: 1px solid #552222; }
    
    .log-box { background: #0a0a0a; border: 1px solid #333; border-radius: 8px; padding: 10px; max-height: 130px; overflow-y: auto; font-family: monospace; font-size: 13px; color: #00ff66; margin-top: 10px; line-height: 1.4; }
  </style>
</head>
<body>

<div class="container">
  <div class="header-bar">
    <span style="font-size: 12px; color: #888; font-weight: bold;" id="setIndicator">Set 1</span>
    <span class="version-tag">v3.5</span>
  </div>

  <div class="match-top-bar">
    <button class="btn-top active" id="btnHome" onclick="setMatchType('home')">Thuis</button>
    <button class="btn-top" id="btnAway" onclick="setMatchType('away')">Uit</button>
    <button class="btn-top" id="btnCup" onclick="toggleCupMode()">Reguliere competitie</button>
  </div>

  <div class="timer-box">
    <div class="timer-hint" id="timerStatusText">Start bij 1e fluitsignaal of automatisch bij 1e punt</div>
    <div class="timer" id="timerDisplay">00:00:00</div>
    <div style="display: flex; justify-content: center; gap: 8px;">
      <button class="btn btn-green" id="btnStartWhistle" onclick="startOnWhistle()">▶ Start wedstrijd</button>
      <button class="btn btn-gray" onclick="downloadSRT()">⬇ Download SRT</button>
    </div>
  </div>

  <div class="swap-bar">
    <button class="btn-swap" onclick="swapSides()">⇄ Wissel Speelhelft</button>
  </div>

  <div class="scoreboard">
    <!-- Linker schermhelft -->
    <div class="team-card">
      <input type="text" id="uiTeamLeft" value="Zovoc" oninput="onNameChange('left')">
      <div class="sets sets-left" id="uiSetsLeft">0</div>
      <div class="score" id="uiScoreLeft">0</div>
      <button class="btn-score-plus btn-blue" id="btnScoreLeft" onclick="addPoint('left')">+1</button>
      <button class="btn-score-minus" onclick="subtractPoint('left')">-1</button>
      <div class="set-controls">
        <button class="btn-set" onclick="adjustSet('left', 1)">Set +</button>
        <button class="btn-set" onclick="adjustSet('left', -1)">Set -</button>
      </div>
    </div>

    <!-- Rechter schermhelft -->
    <div class="team-card">
      <input type="text" id="uiTeamRight" value="Team B" oninput="onNameChange('right')">
      <div class="sets sets-right" id="uiSetsRight">0</div>
      <div class="score" id="uiScoreRight">0</div>
      <button class="btn-score-plus btn-red-score" id="btnScoreRight" onclick="addPoint('right')">+1</button>
      <button class="btn-score-minus" onclick="subtractPoint('right')">-1</button>
      <div class="set-controls">
        <button class="btn-set" onclick="adjustSet('right', 1)">Set +</button>
        <button class="btn-set" onclick="adjustSet('right', -1)">Set -</button>
      </div>
    </div>
  </div>

  <div class="set-results-box">
    <div class="set-results-title">Afgeronde Sets</div>
    <div class="set-results-list" id="setResultsDisplay">Nog geen sets voltooid</div>
  </div>

  <div class="center-controls">
    <button class="btn btn-red" onclick="endSetManual()">Einde Set</button>
    <button class="btn btn-gray" onclick="undo()">Herstel Laatste Actie</button>
    <button class="btn btn-reset" onclick="resetForm()">↺ Reset Formulier</button>
  </div>

  <div class="log-box" id="logBox">Klaar voor de start. Start bij het fluitsignaal of geef direct het eerste punt...</div>
</div>

<script>
  var APP_VERSION = "3.5";
  var STORAGE_KEY = "live_volley_scorer_state_v3_5";

  var startTime = null;
  var timerInterval = null;
  var isRunning = false;
  var timerStopped = false;
  var finalElapsedTime = 0;
  var timerBaseOffset = 0;

  var teamZovocName = "Zovoc";
  var teamOppName = "Team B";
  var scoreZ = 0, scoreOpp = 0;
  var setsZ = 0, setsOpp = 0;

  var matchType = 'home';
  var isCupMatch = false;
  var isSwapped = false;

  var isMatchOver = false;
  var finishedSets = [];
  var log = [];

  function recalculateMatchState() {
    var totalSets = setsZ + setsOpp;
    if (isCupMatch) {
      if (setsZ >= 3 || setsOpp >= 3) {
        isMatchOver = true;
      } else {
        isMatchOver = false;
      }
    } else {
      if (totalSets === 4) {
        if (setsZ === 2 && setsOpp === 2) {
          isMatchOver = false;
        } else {
          isMatchOver = true;
        }
      } else if (totalSets >= 5) {
        isMatchOver = true;
      } else {
        isMatchOver = false;
      }
    }
  }

  function getCurrentSetNumber() {
    return (setsZ + setsOpp) + 1;
  }

  function setMatchType(type) {
    matchType = type;
    document.getElementById('btnHome').className = (matchType === 'home') ? "btn-top active" : "btn-top";
    document.getElementById('btnAway').className = (matchType === 'away') ? "btn-top active" : "btn-top";
    saveToStorage();
    if (isRunning) {
      recordState();
    }
  }

  function toggleCupMode() {
    var totalSets = setsZ + setsOpp;
    if (totalSets >= 3) return;

    isCupMatch = !isCupMatch;
    updateCupButtonUI();
    recalculateMatchState();
    updateDisplay();
    saveToStorage();
    if (isRunning) {
      recordState();
    }
  }

  function updateCupButtonUI() {
    var btn = document.getElementById('btnCup');
    var totalSets = setsZ + setsOpp;

    if (isCupMatch) {
      btn.innerText = "Beker";
      btn.className = "btn-top active";
    } else {
      btn.innerText = "Reguliere competitie";
      btn.className = "btn-top";
    }

    btn.disabled = (totalSets >= 3);
  }

  function onNameChange(side) {
    var val = document.getElementById(side === 'left' ? 'uiTeamLeft' : 'uiTeamRight').value;
    if (!isSwapped) {
      if (side === 'left') teamZovocName = val; else teamOppName = val;
    } else {
      if (side === 'left') teamOppName = val; else teamZovocName = val;
    }
    saveToStorage();
  }

  function saveToStorage() {
    var state = {
      startTime: startTime,
      isRunning: isRunning,
      timerStopped: timerStopped,
      finalElapsedTime: finalElapsedTime,
      timerBaseOffset: timerBaseOffset,
      teamZovocName: teamZovocName,
      teamOppName: teamOppName,
      scoreZ: scoreZ,
      scoreOpp: scoreOpp,
      setsZ: setsZ,
      setsOpp: setsOpp,
      matchType: matchType,
      isCupMatch: isCupMatch,
      isSwapped: isSwapped,
      isMatchOver: isMatchOver,
      finishedSets: finishedSets,
      log: log
    };
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    } catch (e) {
      console.warn("Kon niet opslaan in localStorage", e);
    }
  }

  function loadFromStorage() {
    try {
      var saved = localStorage.getItem(STORAGE_KEY);
      if (!saved) return false;
      var state = JSON.parse(saved);

      startTime = state.startTime;
      isRunning = state.isRunning;
      timerStopped = state.timerStopped;
      finalElapsedTime = state.finalElapsedTime || 0;
      timerBaseOffset = (state.timerBaseOffset !== undefined) ? state.timerBaseOffset : 0;
      teamZovocName = state.teamZovocName || "Zovoc";
      teamOppName = state.teamOppName || "Team B";
      scoreZ = state.scoreZ || 0;
      scoreOpp = state.scoreOpp || 0;
      setsZ = state.setsZ || 0;
      setsOpp = state.setsOpp || 0;
      matchType = state.matchType || 'home';
      isCupMatch = !!state.isCupMatch;
      isSwapped = !!state.isSwapped;
      finishedSets = state.finishedSets || [];
      log = state.log || [];

      recalculateMatchState();
      setMatchType(matchType);
      updateCupButtonUI();

      var btnStart = document.getElementById('btnStartWhistle');
      if (isRunning || timerStopped) {
        if (btnStart) btnStart.style.display = "none";
      }

      if (isRunning && !timerStopped) {
        timerInterval = setInterval(updateTimerDisplay, 250);
        document.getElementById('timerStatusText').innerText = "Wedstrijdtijd loopt (DJI Sync)";
      } else if (timerStopped) {
        document.getElementById('timerStatusText').innerText = isMatchOver ? "Wedstrijd afgelopen - Timer automatisch gestopt" : "Timer gestopt";
        document.getElementById('timerStatusText').style.color = isMatchOver ? "#34c759" : "#ff3b30";
      }

      updateDisplay();
      updateTimerDisplay();
      renderLog();
      return true;
    } catch (e) {
      console.warn("Kon opslag niet laden", e);
      return false;
    }
  }

  function resetForm() {
    if (!confirm("Weet je zeker dat je het hele formulier wilt wissen en opnieuw wilt beginnen?")) {
      return;
    }
    localStorage.removeItem(STORAGE_KEY);
    clearInterval(timerInterval);

    startTime = null;
    timerInterval = null;
    isRunning = false;
    timerStopped = false;
    finalElapsedTime = 0;
    timerBaseOffset = 0;

    teamZovocName = "Zovoc";
    teamOppName = "Team B";
    scoreZ = 0; scoreOpp = 0;
    setsZ = 0; setsOpp = 0;
    matchType = 'home';
    isCupMatch = false;
    isSwapped = false;
    isMatchOver = false;
    finishedSets = [];
    log = [];

    setMatchType('home');
    updateCupButtonUI();
    document.getElementById('timerStatusText').innerText = "Start bij 1e fluitsignaal of automatisch bij 1e punt";
    document.getElementById('timerStatusText').style.color = "#888";

    var btnStart = document.getElementById('btnStartWhistle');
    if (btnStart) btnStart.style.display = "inline-block";

    updateDisplay();
    updateTimerDisplay();
    document.getElementById('logBox').innerHTML = "Klaar voor de start. Start bij het fluitsignaal of geef direct het eerste punt...";
  }

  function getElapsedTime() {
    if (timerStopped) return finalElapsedTime;
    if (!startTime) return 0;
    return timerBaseOffset + ((Date.now() - startTime) / 1000);
  }

  function startOnWhistle() {
    if (isRunning || timerStopped) return;
    
    timerBaseOffset = 0;
    startTime = Date.now();
    timerInterval = setInterval(updateTimerDisplay, 250);
    isRunning = true;

    var btnStart = document.getElementById('btnStartWhistle');
    if (btnStart) btnStart.style.display = "none";

    var statusEl = document.getElementById('timerStatusText');
    if (statusEl) {
      statusEl.innerText = "Wedstrijdtijd loopt (DJI Sync)";
      statusEl.style.color = "#888";
    }

    log.push({ 
      time: 0, 
      text: getScoreStringForValues(0, 0, 0, 0), 
      state: {
        teamZovocName: teamZovocName,
        teamOppName: teamOppName,
        scoreZ: 0,
        scoreOpp: 0,
        setsZ: 0,
        setsOpp: 0,
        matchType: matchType,
        isCupMatch: isCupMatch,
        isSwapped: isSwapped,
        isMatchOver: false,
        finishedSets: [],
        elapsed: 0
      }
    });

    renderLog();
    saveToStorage();
  }

  function autoStartOnFirstPoint() {
    if (!isRunning && !timerStopped) {
      timerBaseOffset = 30;
      startTime = Date.now();
      timerInterval = setInterval(updateTimerDisplay, 250);
      isRunning = true;
      
      var btnStart = document.getElementById('btnStartWhistle');
      if (btnStart) btnStart.style.display = "none";

      var statusEl = document.getElementById('timerStatusText');
      if (statusEl) {
        statusEl.innerText = "Wedstrijdtijd loopt (DJI Sync)";
        statusEl.style.color = "#888";
      }

      if (log.length === 0) {
        log.push({ 
          time: 0, 
          text: getScoreStringForValues(0, 0, 0, 0), 
          state: {
            teamZovocName: teamZovocName,
            teamOppName: teamOppName,
            scoreZ: 0,
            scoreOpp: 0,
            setsZ: 0,
            setsOpp: 0,
            matchType: matchType,
            isCupMatch: isCupMatch,
            isSwapped: isSwapped,
            isMatchOver: false,
            finishedSets: [],
            elapsed: 0
          }
        });
      }
      saveToStorage();
    }
  }

  function autoStopTimerOnMatchEnd() {
    if (timerStopped) return;
    finalElapsedTime = getElapsedTime();
    clearInterval(timerInterval);
    isRunning = false;
    timerStopped = true;

    var statusEl = document.getElementById('timerStatusText');
    if (statusEl) {
      statusEl.innerText = "Wedstrijd afgelopen - Timer automatisch gestopt";
      statusEl.style.color = "#34c759";
    }

    saveToStorage();
  }

  function updateTimerDisplay() {
    var totalSec = Math.floor(getElapsedTime());
    var h = String(Math.floor(totalSec / 3600)).padStart(2, '0');
    var m = String(Math.floor((totalSec % 3600) / 60)).padStart(2, '0');
    var s = String(totalSec % 60).padStart(2, '0');
    var el = document.getElementById('timerDisplay');
    if (el) el.innerText = h + ":" + m + ":" + s;
  }

  function getCurrentState() {
    return {
      teamZovocName: teamZovocName,
      teamOppName: teamOppName,
      scoreZ: scoreZ,
      scoreOpp: scoreOpp,
      setsZ: setsZ,
      setsOpp: setsOpp,
      matchType: matchType,
      isCupMatch: isCupMatch,
      isSwapped: isSwapped,
      isMatchOver: isMatchOver,
      finishedSets: [...finishedSets],
      elapsed: getElapsedTime()
    };
  }

  function getScoreStringForValues(sz, sopp, stz, stopp) {
    var srtTeamLeft = (matchType === 'home') ? teamZovocName : teamOppName;
    var srtTeamRight = (matchType === 'home') ? teamOppName : teamZovocName;

    var srtScoreLeft = (matchType === 'home') ? sz : sopp;
    var srtScoreRight = (matchType === 'home') ? sopp : sz;

    var srtSetsLeft = (matchType === 'home') ? stz : stopp;
    var srtSetsRight = (matchType === 'home') ? stopp : stz;

    var setHistoryStr = "";
    if (finishedSets.length > 0) {
      setHistoryStr = "\n[" + finishedSets.join(", ") + "]";
    }
    
    return srtTeamLeft + "  " + srtScoreLeft + " - " + srtScoreRight + "  " + srtTeamRight + "\n" +
           srtSetsLeft + " - " + srtSetsRight + setHistoryStr;
  }

  function getScoreString() {
    var srtTeamLeft = (matchType === 'home') ? teamZovocName : teamOppName;
    var srtTeamRight = (matchType === 'home') ? teamOppName : teamZovocName;

    var srtScoreLeft = (matchType === 'home') ? scoreZ : scoreOpp;
    var srtScoreRight = (matchType === 'home') ? scoreOpp : scoreZ;

    var srtSetsLeft = (matchType === 'home') ? setsZ : setsOpp;
    var srtSetsRight = (matchType === 'home') ? setsOpp : setsZ;

    var setHistoryStr = "";
    if (finishedSets.length > 0) {
      setHistoryStr = "\n[" + finishedSets.join(", ") + "]";
    }
    
    if (isMatchOver) {
      return srtTeamLeft + "  " + srtSetsLeft + " - " + srtSetsRight + "  " + srtTeamRight + "\n" +
             srtSetsLeft + " - " + srtSetsRight +
             (setHistoryStr || "\n[" + srtSetsLeft + "-" + srtSetsRight + "]");
    }
    
    return srtTeamLeft + "  " + srtScoreLeft + " - " + srtScoreRight + "  " + srtTeamRight + "\n" +
           srtSetsLeft + " - " + srtSetsRight + setHistoryStr;
  }

  function getSRTScoreString(entryState, finalHistoryStr) {
    var mType = entryState.matchType || 'home';
    var srtTeamLeft = (mType === 'home') ? entryState.teamZovocName : entryState.teamOppName;
    var srtTeamRight = (mType === 'home') ? entryState.teamOppName : entryState.teamZovocName;

    var srtScoreLeft = (mType === 'home') ? entryState.scoreZ : entryState.scoreOpp;
    var srtScoreRight = (mType === 'home') ? entryState.scoreOpp : entryState.scoreZ;

    var srtSetsLeft = (mType === 'home') ? entryState.setsZ : entryState.setsOpp;
    var srtSetsRight = (mType === 'home') ? entryState.setsOpp : entryState.setsZ;

    var line1 = entryState.isMatchOver 
      ? srtTeamLeft + "  " + srtSetsLeft + " - " + srtSetsRight + "  " + srtTeamRight
      : srtTeamLeft + "  " + srtScoreLeft + " - " + srtScoreRight + "  " + srtTeamRight;
    var line2 = srtSetsLeft + " - " + srtSetsRight;

    if (finalHistoryStr.trim().length > 0) {
      return line1 + "\n" + line2 + "\n" + finalHistoryStr.trim();
    }
    return line1 + "\n" + line2;
  }

  function renderLog() {
    var logBox = document.getElementById('logBox');
    if (!logBox) return;
    if (log.length === 0) {
      logBox.innerHTML = "Nog geen punten geregistreerd...";
      return;
    }
    logBox.innerHTML = log.map(function(item, idx) {
      var min = Math.floor(item.time / 60);
      var sec = Math.floor(item.time % 60);
      var tStr = String(min).padStart(2,'0') + ":" + String(sec).padStart(2,'0');
      var lines = item.text.split("\n");
      var subText = lines.slice(1).join("  |  ");
      return "<b>[" + tStr + "] #" + (idx + 1) + ":</b> " + lines[0] + "<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;↳ " + (subText || "");
    }).reverse().join("<br><br>");
  }

  function recordState() {
    log.push({
      time: getElapsedTime(),
      text: getScoreString(),
      state: getCurrentState()
    });
    renderLog();
    saveToStorage();
  }

  function updateDisplay() {
    recalculateMatchState();

    var nameLeft = isSwapped ? teamOppName : teamZovocName;
    var nameRight = isSwapped ? teamZovocName : teamOppName;
    var scoreLeft = isSwapped ? scoreOpp : scoreZ;
    var scoreRight = isSwapped ? scoreZ : scoreOpp;
    var setsLeft = isSwapped ? setsOpp : setsZ;
    var setsRight = isSwapped ? setsZ : setsOpp;

    document.getElementById('uiTeamLeft').value = nameLeft;
    document.getElementById('uiTeamRight').value = nameRight;
    document.getElementById('uiScoreLeft').innerText = scoreLeft;
    document.getElementById('uiScoreRight').innerText = scoreRight;
    
    document.getElementById('uiSetsLeft').innerText = setsLeft;
    document.getElementById('uiSetsRight').innerText = setsRight;

    var btnLeft = document.getElementById('btnScoreLeft');
    var btnRight = document.getElementById('btnScoreRight');
    if (!isSwapped) {
      btnLeft.className = "btn-score-plus btn-blue";
      btnRight.className = "btn-score-plus btn-red-score";
    } else {
      btnLeft.className = "btn-score-plus btn-red-score";
      btnRight.className = "btn-score-plus btn-blue";
    }
    
    var elInd = document.getElementById('setIndicator');
    if (elInd) {
      if (isMatchOver) {
        var sL = (matchType === 'home') ? setsZ : setsOpp;
        var sR = (matchType === 'home') ? setsOpp : setsZ;
        elInd.innerText = "Wedstrijd Afgelopen (" + sL + "-" + sR + ")";
        elInd.style.color = "#34c759";
      } else {
        elInd.innerText = "Set " + getCurrentSetNumber();
        elInd.style.color = "#888";
      }
    }

    var elResults = document.getElementById('setResultsDisplay');
    if (elResults) {
      if (finishedSets.length === 0) {
        elResults.innerText = "Nog geen sets voltooid";
        elResults.style.color = "#777";
      } else {
        elResults.innerText = finishedSets.join("   ");
        elResults.style.color = "#34c759";
      }
    }
  }

  function swapSides() {
    isSwapped = !isSwapped;
    updateDisplay();
    saveToStorage();
  }

  function handleSetEnd() {
    var finalSrtLeft = (matchType === 'home') ? scoreZ : scoreOpp;
    var finalSrtRight = (matchType === 'home') ? scoreOpp : scoreZ;
    finishedSets.push(finalSrtLeft + "-" + finalSrtRight);

    if (scoreZ > scoreOpp) {
      setsZ++;
    } else {
      setsOpp++;
    }

    scoreZ = 0;
    scoreOpp = 0;

    recalculateMatchState();

    // Automatisch speelhelft wisselen, behalve als de wedstrijd nu klaar is
    if (isMatchOver) {
      autoStopTimerOnMatchEnd();
    } else {
      isSwapped = !isSwapped;
    }
  }

  function checkSetWon() {
    var target = (getCurrentSetNumber() === 5) ? 15 : 25;
    var diff = Math.abs(scoreZ - scoreOpp);

    if ((scoreZ >= target || scoreOpp >= target) && diff >= 2) {
      handleSetEnd();
    }
  }

  function addPoint(side) {
    if (isMatchOver) {
      alert("De wedstrijd is afgelopen! Gebruik eventueel 'Herstel' om door te gaan.");
      return;
    }

    if (!isRunning && !timerStopped) {
      autoStartOnFirstPoint();
    }

    var isZovoc = (!isSwapped && side === 'left') || (isSwapped && side === 'right');
    if (isZovoc) scoreZ++; else scoreOpp++;

    checkSetWon();
    updateDisplay();
    recordState();
  }

  function subtractPoint(side) {
    if (isMatchOver) return;
    var isZovoc = (!isSwapped && side === 'left') || (isSwapped && side === 'right');
    if (isZovoc && scoreZ > 0) scoreZ--;
    if (!isZovoc && scoreOpp > 0) scoreOpp--;

    updateDisplay();
    recordState();
  }

  function adjustSet(side, delta) {
    var isZovoc = (!isSwapped && side === 'left') || (isSwapped && side === 'right');
    if (isZovoc) {
      setsZ = Math.max(0, setsZ + delta);
    } else {
      setsOpp = Math.max(0, setsOpp + delta);
    }
    recalculateMatchState();
    updateDisplay();
    recordState();
  }

  function endSetManual() {
    if (isMatchOver) return;
    handleSetEnd();
    updateDisplay();
    recordState();
  }

  function undo() {
    if (log.length > 1) {
      var wasMatchOver = isMatchOver;
      log.pop();
      var last = log[log.length - 1].state;
      
      teamZovocName = last.teamZovocName;
      teamOppName = last.teamOppName;
      scoreZ = last.scoreZ;
      scoreOpp = last.scoreOpp;
      setsZ = last.setsZ;
      setsOpp = last.setsOpp;
      matchType = last.matchType || 'home';
      isCupMatch = (last.isCupMatch !== undefined) ? last.isCupMatch : isCupMatch;
      isSwapped = last.isSwapped;
      finishedSets = [...last.finishedSets];

      recalculateMatchState();

      if (wasMatchOver && !isMatchOver) {
        timerStopped = false;
        var restoreElapsed = (last.elapsed !== undefined) ? last.elapsed : log[log.length - 1].time;
        startTime = Date.now() - ((restoreElapsed - timerBaseOffset) * 1000);
        isRunning = true;
        clearInterval(timerInterval);
        timerInterval = setInterval(updateTimerDisplay, 250);

        var statusEl = document.getElementById('timerStatusText');
        if (statusEl) {
          statusEl.innerText = "Wedstrijdtijd loopt (DJI Sync)";
          statusEl.style.color = "#888";
        }
      }

      setMatchType(matchType);
      updateDisplay();
      updateTimerDisplay();
      renderLog();
      saveToStorage();
    }
  }

  function formatSRTTime(seconds) {
    var hours = String(Math.floor(seconds / 3600)).padStart(2, '0');
    var mins = String(Math.floor((seconds % 3600) / 60)).padStart(2, '0');
    var secs = String(Math.floor(seconds % 60)).padStart(2, '0');
    var ms = String(Math.floor((seconds % 1) * 1000)).padStart(3, '0');
    return hours + ":" + mins + ":" + secs + "," + ms;
  }

  function downloadSRT() {
    if (log.length === 0) return;
    var srt = "";
    var totalDuration = getElapsedTime() + 10;

    var finalHistoryStr = "";
    if (finishedSets.length > 0) {
      finalHistoryStr = "[" + finishedSets.join(", ") + "]";
    }

    for (var i = 0; i < log.length; i++) {
      var startTimeVal = log[i].time;
      var endTimeVal = (i < log.length - 1) ? log[i + 1].time : totalDuration;
      
      if (endTimeVal > startTimeVal) {
        srt += (i + 1) + "\n";
        srt += formatSRTTime(startTimeVal) + " --> " + formatSRTTime(endTimeVal) + "\n";
        srt += getSRTScoreString(log[i].state, finalHistoryStr) + "\n\n";
      }
    }

    var now = new Date();
    var maanden = [
      "januari", "februari", "maart", "april", "mei", "juni",
      "juli", "augustus", "september", "oktober", "november", "december"
    ];
    var dag = now.getDate();
    var maand = maanden[now.getMonth()];
    var jaar = now.getFullYear();
    var uren = String(now.getHours()).padStart(2, '0');
    var minuten = String(now.getMinutes()).padStart(2, '0');

    var fileName = "wedstrijd_score_" + dag + "_" + maand + "_" + jaar + "_" + uren + "-" + minuten + ".srt";

    var blob = new Blob([srt], { type: 'text/plain;charset=utf-8' });
    var link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = fileName;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  }

  loadFromStorage();
</script>
</body>
</html>
